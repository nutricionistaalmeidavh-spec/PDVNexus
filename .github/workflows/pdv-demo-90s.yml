name: PDV Nexus Demo 90s

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/workflows/pdv-demo-90s.yml"
      - "windows-10/qa/artisys-qa.demo90.config.json"
      - "windows-10/qa/fixtures/pdv-demo-90s-seed.json"
      - "windows-10/qa/flows/pdv-demo-90s.json"
      - "windows-10/apps/nexus-desktop/main.qa.cjs"
      - "windows-10/apps/pdv-demo/src/**"
      - "windows-10/tools/artisys-qa/src/**"
      - "windows-10/tests/pdv-demo-90s.test.mjs"

concurrency:
  group: pdv-demo-90s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo-90s:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows-10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows-10/package-lock.json
            windows-10/tools/artisys-qa/package-lock.json

      - name: Install PDV dependencies
        run: npm ci

      - name: Install ArtiSys QA dependencies
        run: npm ci --prefix tools/artisys-qa

      - name: Validate 90s demo contract
        run: node --test tests/pdv-demo-90s.test.mjs

      - name: Validate demo manifest
        run: node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.demo90.config.json

      - name: Build PDV renderer
        run: npm run build:pdv-demo

      - name: Install open-source FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Generate real 90s Electron demo
        run: node tools/artisys-qa/src/cli.mjs demo --config qa/artisys-qa.demo90.config.json --demo full-90s --output qa-demo-90s-artifacts

      - name: Verify MP4 duration
        if: success()
        run: |
          $video = Get-ChildItem -Path qa-demo-90s-artifacts -Filter demo-video.mp4 -Recurse | Select-Object -First 1
          if (-not $video) { throw "demo-video.mp4 not found" }
          $duration = [double]((& ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $video.FullName).Trim())
          Write-Host "Demo duration: $duration seconds"
          if ($duration -lt 89 -or $duration -gt 91.5) { throw "Unexpected demo duration: $duration" }

      - name: Upload 90s demo artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-Demo-90s
          path: windows-10/qa-demo-90s-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Remove isolated demo profile
        if: always()
        run: Remove-Item -Recurse -Force qa/.artisys-qa -ErrorAction SilentlyContinue
