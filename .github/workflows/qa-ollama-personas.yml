name: QA - Ollama Personas (Windows)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Número de personas (1 a 10)"
        required: false
        default: "10"
        type: choice
        options: ["1", "3", "5", "10"]
      model:
        description: "Modelo Ollama local CPU"
        required: false
        default: "qwen3:1.7b"
        type: choice
        options: ["qwen3:0.6b", "qwen3:1.7b"]

permissions:
  contents: read

concurrency:
  group: ollama-personas-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qa-personas:
    runs-on: [self-hosted, windows]
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
        working-directory: windows-10

    steps:
      - name: Checkout (somente leitura)
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            windows-10/package-lock.json
            windows-10/tools/artisys-qa/package-lock.json

      - name: Instalar dependencias locais
        run: |
          npm ci
          npm ci --prefix tools/artisys-qa

      - name: Validar limites e testes dos agentes (sem modelo)
        run: node --test tests/pdv-qa-ollama-personas.test.mjs

      - name: Compilar PDV Electron em ambiente de teste
        run: npm run build:pdv-demo

      - name: Verificar Ollama open source instalado no runner próprio
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-Command ollama -ErrorAction Stop).Source
          "OLLAMA_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe --version

      - name: Inicializar Ollama local e baixar modelo
        env:
          OLLAMA_HOST: "127.0.0.1:11434"
          OLLAMA_NO_CLOUD: "1"
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_MAX_LOADED_MODELS: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          New-Item -ItemType Directory -Path $env:OLLAMA_MODELS -Force | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP "ollama-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "ollama-stderr.log"
          $server = Start-Process -FilePath $env:OLLAMA_EXE -ArgumentList "serve" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "OLLAMA_MODELS=$env:OLLAMA_MODELS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OLLAMA_HOST=127.0.0.1:11434" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OLLAMA_NO_CLOUD=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($server.HasExited) { throw "Servidor Ollama encerrou prematuramente" }
            try {
              $null = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 3
              $ok = $true
              break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "Ollama nao iniciou em localhost" }
          $model = "${{ inputs.model || 'qwen3:1.7b' }}"
          if (@("qwen3:0.6b", "qwen3:1.7b") -notcontains $model) { throw "Modelo fora da allowlist" }
          & $env:OLLAMA_EXE pull $model
          if ($LASTEXITCODE -ne 0) { throw "Falha download modelo local" }
          & $env:OLLAMA_EXE list
          $count = "${{ inputs.count || '10' }}"
          node qa/run-ollama-personas.mjs --config qa/ollama-personas.config.json --output qa-ollama-artifacts --count $count --model $model
          if ($LASTEXITCODE -ne 0) { throw "Uma ou mais personas falharam; veja qa-ollama-artifacts/report.md" }

      - name: Relatorio no resumo do GitHub Actions
        if: always()
        run: |
          $report = "qa-ollama-artifacts/report.md"
          if (Test-Path $report) {
            Get-Content $report -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif (Test-Path "qa-ollama-artifacts/infra-error.txt") {
            "## Ollama QA - falha de infraestrutura" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content "qa-ollama-artifacts/infra-error.txt" -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Preservar screenshots, traces, resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-QA-Ollama-Personas
          path: windows-10/qa-ollama-artifacts/
          if-no-files-found: warn
          retention-days: 3
