name: Deploy Telemetry Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-telemetry-cloudflare.yml"
      - "cloudflare/telemetry/**"
  workflow_dispatch:

concurrency:
  group: deploy-pdv-nexus-telemetry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare/telemetry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID ausente"; exit 1; }
          npx wrangler whoami --config wrangler.telemetry.jsonc

      - name: Apply telemetry schema to shared pdvnexus D1
        run: npx wrangler d1 execute pdvnexus --remote --file=migrations/0001_init.sql --config wrangler.telemetry.jsonc

      - name: Configure telemetry admin token when available
        env:
          TELEMETRY_ADMIN_TOKEN: ${{ secrets.PDV_TELEMETRY_ADMIN_TOKEN }}
        run: |
          if [ -n "${TELEMETRY_ADMIN_TOKEN:-}" ]; then
            printf '%s' "$TELEMETRY_ADMIN_TOKEN" | npx wrangler secret put TELEMETRY_ADMIN_TOKEN --config wrangler.telemetry.jsonc
          else
            echo "PDV_TELEMETRY_ADMIN_TOKEN não configurado; ingestão continua ativa e /v1/admin/summary permanece bloqueado."
          fi

      - name: Deploy telemetry Worker
        run: npx wrangler deploy --config wrangler.telemetry.jsonc

      - name: Health check
        run: |
          node -e "fetch('https://pdv-nexus-telemetry.nutricionistaalmeidavh.workers.dev/health').then(async r=>{const body=await r.text(); if(!r.ok) throw new Error('HTTP '+r.status+' '+body); const json=JSON.parse(body); if(json.ok!==true) throw new Error('health inválido'); console.log(body)}).catch(e=>{console.error(e);process.exit(1)})"
