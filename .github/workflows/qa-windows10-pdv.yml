name: QA Windows 10 PDV UI

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/qa-windows10-pdv.yml"
      - ".github/workflows/publish-pdv-release.yml"
      - "pdv-release.json"
      - "windows-10/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-windows10-pdv.yml"
      - ".github/workflows/publish-pdv-release.yml"
      - "pdv-release.json"
      - "windows-10/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  artisys-qa-pdv:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
        working-directory: windows-10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows-10/package-lock.json
            windows-10/tools/artisys-qa/package-lock.json

      - name: Install PDV dependencies
        run: npm ci

      - name: Install ArtiSys QA dependencies
        run: npm ci --prefix tools/artisys-qa

      - name: Test ArtiSys QA runtime extensions
        run: npm test --prefix tools/artisys-qa

      - name: Validate ArtiSys QA manifests
        run: |
          node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.config.json
          node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.demo.config.json

      - name: Validate business journey coverage
        run: node --test tests/pdv-qa-business-flows.test.mjs

      - name: Validate release and Drive sync contract
        run: node --test tests/pdv-release-drive-sync.test.mjs

      - name: E55 presentation requirements
        run: npm run test:e55-presentation

      - name: Typecheck
        run: npm run typecheck

      - name: Test PDV domain and integration flows
        run: npm run test:pdv-payments

      - name: Test safe 0.1.16 to 0.1.17 upgrade
        run: npm run test:pdv-upgrade

      - name: Build PDV renderer
        run: npm run build:pdv-demo

      - name: Capture PDV UI with ArtiSys QA
        run: node tools/artisys-qa/src/cli.mjs run --config qa/artisys-qa.config.json --flow ui-review --output qa-artifacts

      - name: Install open-source FFmpeg for QA demo
        run: choco install ffmpeg -y --no-progress

      - name: Verify demo video tools
        run: |
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Run checkout demo with ArtiSys QA
        run: node tools/artisys-qa/src/cli.mjs demo --config qa/artisys-qa.demo.config.json --demo checkout-flow --output qa-demo-artifacts

      - name: Run physical batch tracking user journey
        run: node tools/artisys-qa/src/cli.mjs run --config qa/artisys-qa.config.json --flow batch-physical-tracking --output qa-batch-tracking-artifacts

      - name: Run business-critical user journeys
        run: node qa/run-business-flows.mjs --config qa/artisys-qa.config.json --suite qa/business-flows.json --output qa-business-artifacts

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-ArtiSys-QA
          path: windows-10/qa-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Upload QA demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-ArtiSys-QA-Demo
          path: windows-10/qa-demo-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Upload physical batch tracking QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-ArtiSys-QA-Batch-Tracking
          path: windows-10/qa-batch-tracking-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Upload business journey QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-ArtiSys-QA-Business-Flows
          path: windows-10/qa-business-artifacts
          if-no-files-found: warn
          retention-days: 3
