name: Temp cleanup transfer release

on:
  push:
    branches: ["feature/store-receipt-info-20260911"]
    paths:
      - ".github/workflows/temp-cleanup-store-receipt-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete pdv-store-receipt-20260911 --repo nutricionistaalmeidavh-spec/PDVNexus --cleanup-tag --yes
