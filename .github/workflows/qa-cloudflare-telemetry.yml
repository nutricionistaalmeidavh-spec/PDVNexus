name: QA Cloudflare Telemetry

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/qa-cloudflare-telemetry.yml"
      - "cloudflare/telemetry/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-cloudflare-telemetry.yml"
      - "cloudflare/telemetry/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare tooling
        working-directory: cloudflare/telemetry
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test telemetry contract
        working-directory: cloudflare/telemetry
        run: npm run check && npm test

      - name: Validate isolated Wrangler bundle
        working-directory: cloudflare/telemetry
        run: npx wrangler deploy --dry-run --config wrangler.telemetry.jsonc --outdir .wrangler-dry-run
