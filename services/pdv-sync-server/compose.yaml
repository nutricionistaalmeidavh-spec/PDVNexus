services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdvnexus
      POSTGRES_USER: pdvnexus
      POSTGRES_PASSWORD: ${PDV_POSTGRES_PASSWORD:?Defina PDV_POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pdvnexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdvnexus -d pdvnexus"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pdvnexus_postgres_data: {}
