name: PDV Nexus Tutorial Library

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/pdv-tutorial-library.yml"
      - "windows-10/qa/artisys-qa.demo.config.json"
      - "windows-10/qa/pdv-demo-ephemeral-entry.cjs"
      - "windows-10/qa/flows/tutorial-*.json"
      - "windows-10/tests/pdv-tutorial-library.test.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tutorial-library:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: windows-10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows-10/package-lock.json
            windows-10/tools/artisys-qa/package-lock.json

      - name: Install PDV dependencies
        run: npm ci

      - name: Install ArtiSys QA dependencies
        run: npm ci --prefix tools/artisys-qa

      - name: Validate tutorial library contract
        run: node --test tests/pdv-tutorial-library.test.mjs

      - name: Validate demo manifest
        run: node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.demo.config.json

      - name: Build PDV renderer
        run: npm run build:pdv-demo

      - name: Install open-source video and Drive tools
        run: |
          choco install ffmpeg -y --no-progress
          choco install rclone -y --no-progress
          ffmpeg -version | Select-Object -First 1
          rclone version | Select-Object -First 1

      - name: Capture tutorials
        run: |
          $items = @(
            @{ Id = "cash-open-close-tutorial"; Slug = "caixa"; Title = "1. Abra o caixa|2. Confira os valores|3. Feche com conferência|Caixa fechado com sucesso" },
            @{ Id = "stock-adjustment-tutorial"; Slug = "estoque"; Title = "1. Acesse Produtos e Estoque|2. Escolha o produto|3. Informe o ajuste|Estoque atualizado" },
            @{ Id = "customer-register-tutorial"; Slug = "cliente"; Title = "1. Acesse Clientes|2. Preencha os dados|3. Cadastre o cliente|Cliente cadastrado" },
            @{ Id = "sales-history-tutorial"; Slug = "historico"; Title = "1. Acesse Financeiro|2. Abra o histórico|3. Consulte as vendas|Histórico localizado" },
            @{ Id = "reports-dashboard-tutorial"; Slug = "relatorios"; Title = "1. Acesse Financeiro|2. Veja o dashboard|3. Confira vendas e ticket médio|Relatórios disponíveis" }
          )
          foreach ($item in $items) {
            $out = "qa-tutorial-library-artifacts/$($item.Slug)"
            node tools/artisys-qa/src/cli.mjs demo --config qa/artisys-qa.demo.config.json --demo $item.Id --output $out
            $summary = Get-ChildItem $out -Recurse -Filter demo-summary.json | Select-Object -First 1
            if (-not $summary) { throw "demo-summary.json não encontrado para $($item.Id)" }
            $data = Get-Content $summary.FullName -Raw | ConvertFrom-Json
            if ($data.status -ne "passed") { throw "$($item.Id) falhou: $($data.status)" }
            $video = Get-ChildItem $out -Recurse -Filter demo-video.mp4 | Select-Object -First 1
            if (-not $video) { throw "demo-video.mp4 não encontrado para $($item.Id)" }

            $texts = $item.Title.Split('|')
            $font = 'C\:/Windows/Fonts/segoeui.ttf'
            $vf = "drawtext=fontfile='$font':text='$($texts[0])':fontcolor=white:fontsize=42:box=1:boxcolor=black@0.70:boxborderw=18:x=(w-text_w)/2:y=h-110:enable='between(t,0.3,4.8)'," +
                  "drawtext=fontfile='$font':text='$($texts[1])':fontcolor=white:fontsize=42:box=1:boxcolor=black@0.70:boxborderw=18:x=(w-text_w)/2:y=h-110:enable='between(t,5,9.5)'," +
                  "drawtext=fontfile='$font':text='$($texts[2])':fontcolor=white:fontsize=42:box=1:boxcolor=black@0.70:boxborderw=18:x=(w-text_w)/2:y=h-110:enable='between(t,9.7,14.7)'," +
                  "drawtext=fontfile='$font':text='$($texts[3])':fontcolor=white:fontsize=46:box=1:boxcolor=black@0.78:boxborderw=20:x=(w-text_w)/2:y=h-110:enable='between(t,14.9,20)'"
            $final = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-$($item.Slug).mp4"
            ffmpeg -y -i $video.FullName -vf $vf -c:v libx264 -preset medium -crf 20 -an -movflags +faststart $final
            $duration = [double](ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $final)
            if ($duration -lt 19 -or $duration -gt 21) { throw "Duração inesperada para $($item.Id): $duration s" }
          }

      - name: Upload tutorial library artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-Tutorial-Library
          path: windows-10/qa-tutorial-library-artifacts/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Publish tutorials to Google Drive
        env:
          PDV_GDRIVE_RCLONE_CONFIG: ${{ secrets.PDV_GDRIVE_RCLONE_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PDV_GDRIVE_RCLONE_CONFIG)) {
            throw "PDV_GDRIVE_RCLONE_CONFIG não configurado; tutoriais não serão publicados parcialmente."
          }

          $release = Get-Content ../pdv-release.json -Raw | ConvertFrom-Json
          $remote = $release.distribution.googleDrive.remoteName
          $rootId = $release.distribution.googleDrive.rootFolderId
          if ([string]::IsNullOrWhiteSpace($remote) -or [string]::IsNullOrWhiteSpace($rootId)) {
            throw "Configuração do Drive ausente em pdv-release.json"
          }

          $configPath = Join-Path $env:RUNNER_TEMP "pdv-rclone.conf"
          [System.IO.File]::WriteAllText($configPath, $env:PDV_GDRIVE_RCLONE_CONFIG)
          $flags = @("--config", $configPath, "--drive-root-folder-id", $rootId)
          & rclone lsf "${remote}:TUTORIAIS EM VIDEO" @flags | Out-Null

          $files = @(
            @{ Local = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-caixa.mp4"; Drive = "Tutorial - Como abrir e fechar o caixa.mp4" },
            @{ Local = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-estoque.mp4"; Drive = "Tutorial - Como consultar e ajustar o estoque.mp4" },
            @{ Local = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-cliente.mp4"; Drive = "Tutorial - Como cadastrar um cliente.mp4" },
            @{ Local = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-historico.mp4"; Drive = "Tutorial - Como consultar o histórico de vendas.mp4" },
            @{ Local = "qa-tutorial-library-artifacts/PDV-Nexus-Tutorial-relatorios.mp4"; Drive = "Tutorial - Como visualizar relatórios do negócio.mp4" }
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file.Local)) { throw "Vídeo ausente: $($file.Local)" }
            & rclone copyto $file.Local "${remote}:TUTORIAIS EM VIDEO/$($file.Drive)" @flags --checksum
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar $($file.Drive)" }
          }

          $listing = & rclone lsf "${remote}:TUTORIAIS EM VIDEO" @flags
          foreach ($file in $files) {
            if ($listing -notcontains $file.Drive) { throw "Drive não confirmou $($file.Drive)" }
          }
