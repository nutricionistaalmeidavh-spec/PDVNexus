name: One-time store receipt rollout

on:
  push:
    branches: ["feature/store-receipt-info-20260911"]
    paths:
      - ".github/workflows/one-time-store-receipt.yml"
      - "scripts/apply-store-receipt-info.mjs"

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/store-receipt-info-20260911

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded source patch
        run: node scripts/apply-store-receipt-info.mjs

      - name: Diff sanity check
        run: git diff --check

      - name: Install Windows 10 dependencies
        working-directory: windows-10
        run: npm ci

      - name: Typecheck Windows 10
        working-directory: windows-10
        run: npm run typecheck

      - name: Test Windows 10 PDV core and receipt regression
        working-directory: windows-10
        run: npm run test:pdv-payments

      - name: Build Windows 10 web bundle
        working-directory: windows-10
        run: npm run build:pdv-demo

      - name: Install legacy Windows dependencies
        working-directory: windows-7
        run: npm ci

      - name: Typecheck Windows 7 and Windows 8 base
        working-directory: windows-7
        run: npm run typecheck

      - name: Test legacy PDV core and receipt regression
        working-directory: windows-7
        run: npm run test:pdv-payments

      - name: Build legacy web bundle
        working-directory: windows-7
        run: npm run build:pdv-demo

      - name: Commit only after regression gates pass
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-store-receipt.yml scripts/apply-store-receipt-info.mjs
          git add windows-10 windows-7
          git commit -m "feat(pdv): optional store data on non-fiscal receipt"
          git push origin HEAD:feature/store-receipt-info-20260911

      - name: Build Windows 10 installer
        working-directory: windows-10
        run: npm run desktop:dist:pdv

      - name: Build Windows 7 x64 installer
        working-directory: windows-7
        run: npm run desktop:dist:pdv:win7

      - name: Build Windows 8 32-bit installer
        working-directory: windows-7/apps/nexus-desktop
        run: npx electron-builder --config electron-builder-pdv-win8-x86.cjs

      - name: Verify installers and write SHA256
        shell: pwsh
        run: |
          $win10 = Get-ChildItem "windows-10/apps/nexus-desktop/dist-desktop/pdv-demo" -Filter "PDV-Nexus-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $win7 = Get-ChildItem "windows-7/apps/nexus-desktop/dist-desktop/pdv-demo-windows-7" -Filter "PDV-Nexus-Windows-7-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $win8 = Get-ChildItem "windows-7/apps/nexus-desktop/dist-desktop/pdv-demo-windows-8-x86" -Filter "PDV-Nexus-Windows-8-32bit-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $win10 -or -not $win7 -or -not $win8) { throw "One or more installer EXEs were not generated." }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $win10.FullName artifacts/
          Copy-Item $win7.FullName artifacts/
          Copy-Item $win8.FullName artifacts/
          Get-FileHash -Algorithm SHA256 artifacts/*.exe | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts | Format-Table Name,Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload validated installers
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Nexus-Validated-Installers
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
