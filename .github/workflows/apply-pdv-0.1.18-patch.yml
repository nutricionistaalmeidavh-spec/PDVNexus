name: Apply PDV 0.1.18 Patch

on:
  push:
    branches:
      - feat/pdv-0.1.18-cart-quantity-release-guard
    paths:
      - .github/workflows/apply-pdv-0.1.18-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pdv-0.1.18-cart-quantity-release-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply implementation patch
        run: node scripts/apply-pdv-0.1.18.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Install and test Windows 10 line
        working-directory: windows-10
        run: |
          npm ci
          npm run typecheck
          npm run test:pdv-payments
          npm run test:pdv-upgrade

      - name: Install and test Windows 7/8 legacy line
        working-directory: windows-7
        run: |
          npm ci
          npm run typecheck
          npm run test:pdv-payments
          npm run test:pdv-upgrade

      - name: Commit verified application changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-10/apps/pdv-demo/src/PdvDemoApp.tsx windows-7/apps/pdv-demo/src/PdvDemoApp.tsx pdv-release.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(pdv): release 0.1.18 with cart quantity controls"
          git push origin HEAD:feat/pdv-0.1.18-cart-quantity-release-guard
