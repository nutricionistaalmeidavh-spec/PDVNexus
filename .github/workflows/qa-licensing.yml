name: QA Licensing PDV Nexus

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/qa-licensing.yml"
      - "package.json"
      - "licensing/**"
      - "cloudflare/telemetry/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-licensing.yml"
      - "package.json"
      - "licensing/**"
      - "cloudflare/telemetry/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Cloudflare licensing
        run: npm run build
